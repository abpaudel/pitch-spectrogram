      <path d="M56 372q18 -32 36 0t36 0t36 0C196 372 206 300 240 292" stroke-width="34" filter="url(#glow)" opacity="0.85"/>
      <path d="M56 372q18 -32 36 0t36 0t36 0C196 372 206 300 240 292" stroke-width="28"/>
      <path d="M56 372q18 -32 36 0t36 0t36 0C196 372 206 300 240 292" stroke="#fff" stroke-width="7" stroke-opacity="0.35"/>
    </g>
    <g fill="url(#pitch)" stroke="url(#pitch)" filter="url(#glow)" opacity="0.85">
