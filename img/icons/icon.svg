      <stop offset="0.0909" stop-color="#4dff4d"/>
      <stop offset="0.1818" stop-color="#4dffa6"/>
      <stop offset="0.2727" stop-color="#4dffff"/>
      <stop offset="0.3636" stop-color="#4da6ff"/>
