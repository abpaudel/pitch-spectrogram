<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pitch Spectrogram</title>
  <meta name="description" content="A live, octave-wrapped pitch spectrogram in your browser: see the notes you sing or play, colour-coded by pitch class.">
  <link rel="canonical" href="https://abpaudel.com/pitch-spectrogram/">

  <meta property="og:type" content="website">
  <meta property="og:title" content="Pitch Spectrogram">
  <meta property="og:description" content="A live, octave-wrapped pitch spectrogram in your browser: see the notes you sing or play, colour-coded by pitch class.">
  <meta property="og:url" content="https://abpaudel.com/pitch-spectrogram/">
  <meta property="og:image" content="https://abpaudel.com/pitch-spectrogram/img/spectrogram-demo.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="1000">
  <meta property="og:image:height" content="520">
  <meta property="og:image:alt" content="Pitch spectrogram with coloured note traces across twelve labelled pitch rows">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Pitch Spectrogram">
  <meta name="twitter:description" content="A live, octave-wrapped pitch spectrogram in your browser: see the notes you sing or play, colour-coded by pitch class.">
  <meta name="twitter:image" content="https://abpaudel.com/pitch-spectrogram/img/spectrogram-demo.jpg">
  <meta name="twitter:image:alt" content="Pitch spectrogram with coloured note traces across twelve labelled pitch rows">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="stage">
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
  </main>

  <button id="menu" type="button" aria-label="Options">⋮</button>
  <button id="fullscreen" type="button" aria-label="Enter full screen" hidden>
    <svg class="fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="fs-exit" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>

  <section id="options" hidden>
    <h2>Options</h2>
    <label>Analysis Sensitivity
      <select id="opt-sensitivity">
        <option value="low">Low</option>
        <option value="medium">Medium</option>
        <option value="high">High</option>
      </select>
    </label>
    <label>Analysis Rate
      <select id="opt-rate">
        <option value="0">Low</option>
        <option value="1">Medium</option>
        <option value="2">High</option>
      </select>
    </label>
    <label>Sample Rate
      <select id="opt-quality">
        <option value="0">11025 Hz</option>
        <option value="1">22050 Hz</option>
        <option value="2">44100 Hz</option>
      </select>
    </label>
    <label>Note names
      <select id="opt-naming">
        <option value="sharps">Sharps</option>
        <option value="flats">Flats</option>
        <option value="mixed">C♯ E♭ F♯ G♯ B♭</option>
      </select>
    </label>
    <label>Calibration (A4, Hz)
      <input id="opt-ref" type="number" min="420" max="460" step="0.5">
    </label>
    <button id="opt-close" type="button">OK</button>
  </section>

  <div id="start" role="button" tabindex="0">
    <h1>Pitch Spectrogram</h1>
    <h3>Click to start the microphone</h3>
    <p>All audio is processed locally in your browser.</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
